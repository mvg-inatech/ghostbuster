  is_save_map: 1

Odometry:
  cov_gyr: 0.1 # 0.01
  cov_acc: 0.1
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  down_size: 0.2 # 0.2
  # true = original behaviour: each surviving point is the CENTROID of every
  # return in its 5 cm cell, so it is not a measurement. false = keep the first
  # real return. Non-xyz fields always come from the first point either way.
  downsample_average: false
  # dept_err: 0.02
  beam_err: 0.05
  dept_err: 0.02
  voxel_size: 1 #2 # 0.5
  min_eigen_value: 0.0015 # 0.001 gave 80% of points in 6.25 cm leaves (max_layer floor) with only ~2 pts each; 0.0025 left 60% at 0.25-0.5 m
  degrade_bound: 10
  point_notime: 0

LocalBA:
  win_size: 10
  max_layer: 4 # 1
  cov_gyr: 0.01 # 0.01
  cov_acc: 1
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  min_ba_point: 1
  # eigen_value_array: [16.0, 16.0, 16.0, 16.0]
  # eigen_value_array: [4.0, 4.0, 4.0, 4.0]
  plane_eigen_value_thre: [1.0, 1.0, 1.0, 1.0]
  imu_coef: 0.0002
  thread_num: 20

Loop:
  jud_default: 0.5 #0.45 # 0.5
  icp_eigval: 9 # 9
  ratio_drift: 0.1 #0.01
  curr_halt: 5 # 10
  prev_halt: 10
  acsize: 2
  mgsize: 2
  isHighFly: 0

GBA:
  voxel_size: 2
  min_eigen_value: 0.01
  eigen_value_array: [4.0, 4.0, 4.0, 4.0]
  total_max_iter: 6

SaveFields:
  pv_var:           0   # RETIRED — keep 0. tr(point covariance) mixed sensor range/beam
                        # noise with the lever-arm EKF pose term in one scalar and was
                        # dominated by range². global_pcd_converter.py no longer reads it
                        # and derives `range` + `pose_unc_rot` separately instead.
  balm_res:         1   # BALM point-to-plane residual (m); -1 = no plane
  ekf_res:          1   # EKF point-to-plane residual (m); -1 = no match
  cell_id:          1   # fixed finest-grid cell index (voxel_size/2^max_layer =
                        # 6.25 cm); same value = same place, across visits
  reflectivity:     1   # Ouster calibrated reflectivity (0–255)
  plane_quality:    1   # λ_min/λ_max of voxel plane; 0 = flat; -1 = no plane
  obs_count:        1   # number of scans that contributed to this voxel
  view_diversity:   1   # λ_min of the MEAN viewing-direction scatter:
                        # 0 = every look from one direction, 1/3 = isotropic
  temp_consistency: 1   # std-dev of plane residuals over time; -1 = no plane yet
  ambient:          1   # Ouster background NIR ("near_ir"): scene illumination,
                        # measured independently of the laser return
  ring:             1   # Ouster beam index 0-127; also encodes elevation angle
  scan_time:        1   # seconds since the start of the sweep (per-point `t`)

